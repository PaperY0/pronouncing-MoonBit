name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$(cat .moonbit-version)"
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Versions
        run: moon version --all

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 与 demo/build.sh 保持同一步骤：库编到 js 后端，产物拷到 demo/
      - name: Build MoonBit → JS
        run: |
          moon build --target js --release
          cp _build/js/release/build/demo/web/web.js demo/pronouncing.js
          test -s demo/pronouncing.js

      - name: Test demo before deployment
        run: node --test tools/test_demo.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4